name: Build arm64-v8a APK (unsigned)

on:
  workflow_dispatch:

jobs:
  build_arm64_unsigned:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Restrict native libs to arm64-v8a only
        run: |
          sed -i 's/abiFilters += arrayOf("arm64-v8a", "armeabi-v7a")/abiFilters += arrayOf("arm64-v8a")/' app/build.gradle.kts

      - name: Build Release APK (unsigned, arm64-v8a only)
        run: ./gradlew assembleRelease

      - name: Locate built APK
        id: locate
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "Found APK at $APK_PATH"

      - name: Set Run Date
        id: date
        run: echo "RUN_DATE=$(date +%Y-%m-%d)" >> $GITHUB_ENV

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: chocola-arm64-v8a-unsigned
          path: ${{ steps.locate.outputs.apk_path }}
